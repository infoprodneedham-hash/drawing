<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Paint App</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            overflow: hidden; /* Prevent scrolling */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- Canvas Area --- */
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #ffffff;
            cursor: crosshair;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
            touch-action: none; /* Critical for mobile drawing */
        }

        /* --- Controls Area --- */
        .toolbar {
            background-color: #333;
            color: white;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        /* Scrollable row for small screens if needed */
        .scroll-row {
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
        }

        /* Buttons & Inputs */
        button, .color-btn {
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.1s;
        }

        button:active, .color-btn:active {
            transform: scale(0.95);
        }

        /* Color Palette */
        .color-btn {
            width: 35px;
            height: 35px;
            border: 2px solid #555;
            display: inline-block;
        }

        .color-btn.active {
            border: 3px solid white;
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        /* Utility Buttons (Save, Clear) */
        .btn-util {
            padding: 8px 12px;
            background-color: #555;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        
        /* Tool Groups (Brush/Eraser/Size/Type) */
        .tool-group {
            display: flex;
            background: #444;
            border-radius: 8px;
            padding: 4px;
        }

        .tool-btn {
            background: transparent;
            color: #aaa;
            padding: 8px 12px;
            font-size: 14px;
        }

        .tool-btn.active {
            background-color: #666;
            color: white;
            border-radius: 6px;
        }

        /* Size Indicators */
        .size-dot {
            background-color: currentColor;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="drawingBoard"></canvas>
    </div>

    <div class="toolbar">
        
        <div class="row scroll-row" id="colorContainer">
            <div class="color-btn active" style="background-color: #000000;" data-color="#000000"></div>
            <div class="color-btn" style="background-color: #FF3B30;" data-color="#FF3B30"></div> <div class="color-btn" style="background-color: #FFCC00;" data-color="#FFCC00"></div> <div class="color-btn" style="background-color: #34C759;" data-color="#34C759"></div> <div class="color-btn" style="background-color: #007AFF;" data-color="#007AFF"></div> <div class="color-btn" style="background-color: #AF52DE;" data-color="#AF52DE"></div> </div>

        <div class="row">
            <div class="tool-group">
                <button class="tool-btn active" onclick="setBrushStyle('round')" title="Round Pen">Pen</button>
                <button class="tool-btn" onclick="setBrushStyle('square')" title="Square Chisel">Flat</button>
                <button class="tool-btn" onclick="setBrushStyle('marker')" title="Semi-transparent">Ink</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" onclick="setLineWidth(5)"><span class="size-dot" style="width: 4px; height: 4px;"></span></button>
                <button class="tool-btn active" onclick="setLineWidth(10)"><span class="size-dot" style="width: 8px; height: 8px;"></span></button>
                <button class="tool-btn" onclick="setLineWidth(20)"><span class="size-dot" style="width: 14px; height: 14px;"></span></button>
            </div>
            
             <div class="tool-group">
                <button class="tool-btn" id="eraserBtn" onclick="toggleEraser()">Eraser</button>
            </div>
        </div>

        <div class="row">
            <button class="btn-util" onclick="clearCanvas()">Clear</button>
            <button class="btn-util" style="background-color: #007AFF;" onclick="saveImage()">Save JPG</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingBoard');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        // State
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        // Default Settings
        let currentSize = 10;
        let currentColor = '#000000';
        let currentLineCap = 'round'; // round, square, butt
        let isMarkerMode = false;     // for transparency effect
        let isEraser = false;

        // --- Initialization ---
        function resizeCanvas() {
            // Save current image data to prevent loss on resize
            const savedImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Fill white background immediately (needed for JPG save)
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Attempt to restore image (basic implementation)
            // Note: On significant resize/rotate, this might clip or center. 
            // For a simple app, we just redraw the white bg.
             ctx.putImageData(savedImage, 0, 0);
        }

        window.addEventListener('load', () => {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            // Set initial white background
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
        
        window.addEventListener('resize', resizeCanvas);

        // --- Input Handling (Touch & Mouse) ---
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // Check if it's a touch event
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            // Fallback to mouse
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            draw(e); // Draw a dot immediately
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath(); // Reset path so lines don't connect weirdly
        }

        function draw(e) {
            if (!isDrawing) return;
            
            // Prevent scrolling on mobile
            if(e.cancelable) e.preventDefault();

            const pos = getPos(e);

            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap; // round, square, or butt
            ctx.lineJoin = currentLineCap; // smooths corners for round

            if (isEraser) {
                ctx.strokeStyle = "#FFFFFF"; // Erase by painting white
                ctx.globalAlpha = 1.0;
            } else {
                ctx.strokeStyle = currentColor;
                // Marker effect: lower opacity
                ctx.globalAlpha = isMarkerMode ? 0.05 : 1.0; 
                
                // If marker, we force 'round' usually looks best, but let user choose
                if(isMarkerMode) {
                   ctx.globalCompositeOperation = 'multiply'; // nice blending
                } else {
                   ctx.globalCompositeOperation = 'source-over'; // standard
                }
            }

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        // Event Listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // --- Tools Logic ---

        // Color Picker
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Turn off eraser if a color is picked
                isEraser = false;
                document.getElementById('eraserBtn').classList.remove('active');
                
                // Set Color
                currentColor = btn.getAttribute('data-color');
                
                // UI update
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Brush Thickness
        function setLineWidth(size) {
            currentSize = size;
            // UI logic to highlight active size button would go here
            // (Simplified: relies on visually checking stroke)
        }

        // Brush Style
        function setBrushStyle(style) {
            isMarkerMode = false;
            ctx.globalCompositeOperation = 'source-over';

            if (style === 'round') {
                currentLineCap = 'round';
            } else if (style === 'square') {
                currentLineCap = 'square';
            } else if (style === 'marker') {
                currentLineCap = 'round';
                isMarkerMode = true;
            }
            
            // Turn off eraser if brush style changes
            if(isEraser) toggleEraser();
        }

        // Eraser
        function toggleEraser() {
            isEraser = !isEraser;
            const btn = document.getElementById('eraserBtn');
            if (isEraser) {
                btn.classList.add('active');
                ctx.globalCompositeOperation = 'source-over'; // Reset blending for eraser
            } else {
                btn.classList.remove('active');
            }
        }

        // Clear Canvas
        function clearCanvas() {
            if (confirm('Clear drawing?')) {
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // Save Image
        function saveImage() {
            // Create a temporary link
            const link = document.createElement('a');
            link.download = 'my-drawing.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9); // 0.9 quality
            link.click();
        }

        // --- Helper for Thickness UI ---
        // Add click handlers to thickness buttons to manage 'active' class
        const sizeBtns = document.querySelectorAll('.tool-group button[onclick^="setLineWidth"]');
        sizeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                sizeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Add click handlers to style buttons
        const styleBtns = document.querySelectorAll('.tool-group button[onclick^="setBrushStyle"]');
        styleBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                styleBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

    </script>
</body>
</html>
