<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Paint App V4</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
        }

        /* --- Canvas Area --- */
        #canvas-container {
            flex: 1;
            position: relative;
            background-color: #ffffff;
            cursor: crosshair;
            overflow: hidden;
            border-radius: 0 0 15px 15px;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        /* --- Controls Area --- */
        .toolbar {
            background-color: #222;
            color: white;
            padding: 10px;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .scroll-row {
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 2px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scroll-row::-webkit-scrollbar { display: none; }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
            transition: transform 0.1s, opacity 0.1s;
        }

        button:active { transform: scale(0.95); opacity: 0.8; }

        /* Color Palette */
        .color-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #555;
            display: inline-block;
            flex-shrink: 0;
            margin-right: 8px;
        }
        .color-btn.active {
            border: 3px solid white;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        /* Tool Groups */
        .tool-group {
            display: flex;
            background: #333;
            border-radius: 12px;
            padding: 3px;
        }

        .tool-btn {
            background: transparent;
            color: #aaa;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .tool-btn.active {
            background-color: #555;
            color: white;
            border-radius: 9px;
            font-weight: bold;
        }

        /* Size Dots */
        .size-dot {
            background-color: currentColor;
            border-radius: 50%;
            display: inline-block;
        }

        /* Action Buttons */
        .action-btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-clear { background-color: #3a3a3a; color: #ff6b6b; }
        .btn-save { background-color: #007AFF; color: white; }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="drawingBoard"></canvas>
    </div>

    <div class="toolbar">
        <div class="row scroll-row">
            <div class="color-btn active" style="background-color: #000000;" data-color="#000000"></div>
            <div class="color-btn" style="background-color: #FF3B30;" data-color="#FF3B30"></div>
            <div class="color-btn" style="background-color: #FF9500;" data-color="#FF9500"></div>
            <div class="color-btn" style="background-color: #FFCC00;" data-color="#FFCC00"></div>
            <div class="color-btn" style="background-color: #34C759;" data-color="#34C759"></div>
            <div class="color-btn" style="background-color: #007AFF;" data-color="#007AFF"></div>
            <div class="color-btn" style="background-color: #AF52DE;" data-color="#AF52DE"></div>
        </div>

        <div class="row">
            <div class="tool-group">
                <button class="tool-btn" onclick="setLineWidth(4)"><span class="size-dot" style="width: 4px; height: 4px;"></span></button>
                <button class="tool-btn active" onclick="setLineWidth(10)"><span class="size-dot" style="width: 8px; height: 8px;"></span></button>
                <button class="tool-btn" onclick="setLineWidth(20)"><span class="size-dot" style="width: 14px; height: 14px;"></span></button>
            </div>

            <div class="tool-group">
                <button class="tool-btn active" onclick="setBrushStyle('round')">Pen</button>
                <button class="tool-btn" onclick="setBrushStyle('calligraphy')" title="Diagonal Line">Nib</button>
                <button class="tool-btn" onclick="setBrushStyle('marker')" title="Transparent">Ink</button>
            </div>
            
             <div class="tool-group">
                <button class="tool-btn" id="eraserBtn" onclick="toggleEraser()">Eraser</button>
            </div>
        </div>

        <div class="row">
            <button id="clearBtn" class="action-btn btn-clear">CLEAR</button>
            <button class="action-btn btn-save" onclick="saveImage()">SAVE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingBoard');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        // Default Settings
        let currentSize = 10;
        let currentColor = '#000000';
        let brushType = 'round'; // round, calligraphy, marker
        let isEraser = false;

        // --- Setup ---
        function initCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('load', initCanvas);
        window.addEventListener('resize', () => {
            setTimeout(() => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(tempCanvas, 0, 0);
            }, 100);
        });

        // --- Input Handling ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let cx, cy;
            if (e.touches && e.touches.length > 0) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            return { x: cx - rect.left, y: cy - rect.top };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            draw(e); 
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            if(e.cancelable) e.preventDefault(); 

            const pos = getPos(e);
            
            // 1. Eraser Logic
            if (isEraser) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = "#FFFFFF";
                ctx.globalAlpha = 1.0;
                ctx.lineWidth = currentSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } 
            // 2. Brush Logic
            else {
                ctx.fillStyle = currentColor;
                ctx.strokeStyle = currentColor;

                if (brushType === 'marker') {
                    ctx.globalCompositeOperation = 'multiply'; 
                    ctx.globalAlpha = 0.2; // Opacity increased to 20%
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                if (brushType === 'calligraphy') {
                    // Calligraphy Nib Calculation
                    const angle = -45 * (Math.PI / 180); 
                    const halfW = currentSize;
                    const dx = Math.cos(angle) * halfW;
                    const dy = Math.sin(angle) * halfW;

                    ctx.beginPath();
                    ctx.moveTo(lastX - dx, lastY - dy);
                    ctx.lineTo(pos.x - dx, pos.y - dy);
                    ctx.lineTo(pos.x + dx, pos.y + dy);
                    ctx.lineTo(lastX + dx, lastY + dy);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Standard Round / Marker
                    ctx.lineWidth = currentSize;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                }
            }

            lastX = pos.x;
            lastY = pos.y;
        }

        // --- Event Listeners ---
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // --- Buttons ---
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                isEraser = false;
                document.getElementById('eraserBtn').classList.remove('active');
                currentColor = this.getAttribute('data-color');
                updateActiveButton(this);
            });
        });

        // CLEAR FIX: Force reset blending mode before clearing
        document.getElementById('clearBtn').addEventListener('click', () => {
             ctx.globalCompositeOperation = 'source-over'; // <--- THIS FIXES THE BUG
             ctx.fillStyle = "#FFFFFF";
             ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        window.saveImage = function() {
            const link = document.createElement('a');
            link.download = 'drawing.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        }

        window.setLineWidth = function(size) {
            currentSize = size;
            updateToolUI('setLineWidth', size);
        }

        window.setBrushStyle = function(style) {
            brushType = style;
            if(isEraser) toggleEraser(); 
            updateToolUI('setBrushStyle', style);
        }

        window.toggleEraser = function() {
            isEraser = !isEraser;
            document.getElementById('eraserBtn').classList.toggle('active', isEraser);
        }

        // Helpers
        function updateActiveButton(activeBtn) {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        function updateToolUI(funcName, val) {
            const btns = document.querySelectorAll(`button[onclick^="${funcName}"]`);
            btns.forEach(b => b.classList.remove('active'));
            btns.forEach(b => {
                if(b.getAttribute('onclick').includes(val)) b.classList.add('active');
            });
        }
    </script>
</body>
</html>
